name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Committed bundle must match src/ (run `npm run build` before committing)
        run: git diff --exit-code -- index.html style.css app.js

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (split / merge / host check, zero console errors)
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
